<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ tạo mã điểm danh</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f7f6; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #696cff; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; width: 100%; font-size: 16px; margin-bottom: 15px;}
        button:hover { background-color: #5f61e6; }
        .result-box { display: flex; gap: 10px; margin-top: 15px;}
        .result-box input { margin: 0; background: #eef; font-weight: bold; color: #333;}
        .btn-copy { background-color: #28a745; width: auto; white-space: nowrap;}
        .btn-copy:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h3 style="text-align: center; color: #333;">TẠO MÃ GỬI XUỐNG ESP32</h3>
    
    <label>Mã thẻ:</label>
    <input type="text" id="maThe" placeholder="Nhập mã thẻ...">

    <label>Họ tên:</label>
    <input type="text" id="hoTen" placeholder="Nhập họ tên...">

    <label>Mã sinh viên:</label>
    <input type="text" id="maSV" placeholder="Nhập mã SV...">

    <label>Ca học:</label>
    <input type="text" id="caHoc" placeholder="Nhập ca học...">

    <button onclick="taoChuoi()">TẠO CHUỖI DỮ LIỆU</button>

    <div style="border-top: 1px solid #ddd; padding-top: 15px;">
        <label>Chuỗi kết quả (Copy và dán vào ERa):</label>
        <div class="result-box">
            <input type="text" id="ketQua" readonly>
            <button class="btn-copy" onclick="copyChuoi()">Copy</button>
        </div>
    </div>
</div>

<script>
    function taoChuoi() {
        const t1 = document.getElementById('maThe').value.trim();
        const t2 = document.getElementById('hoTen').value.trim();
        const t3 = document.getElementById('maSV').value.trim();
        const t4 = document.getElementById('caHoc').value.trim();

        if(!t1 || !t2) { alert("Vui lòng nhập ít nhất Mã Thẻ và Họ Tên!"); return; }
        
        // Gộp chuỗi theo đúng format ESP32 đang chờ
        const chuoi = `${t1}|${t2}|${t3}|${t4}`;
        document.getElementById('ketQua').value = chuoi;
    }

    function copyChuoi() {
        const copyText = document.getElementById("ketQua");
        copyText.select();
        document.execCommand("copy");
        alert("Đã Copy: " + copyText.value);
    }
</script>

</body>
</html>
