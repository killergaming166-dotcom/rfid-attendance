<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Nút Nhấn Iframe</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f7f6; font-family: Arial, sans-serif; gap: 20px; }
        button { padding: 15px 30px; font-size: 18px; font-weight: bold; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        #btnV7 { background-color: #28a745; } /* Nút xanh lá */
        #btnV7:hover { background-color: #218838; }
        #btnV8 { background-color: #007bff; } /* Nút xanh dương */
        #btnV8:hover { background-color: #0069d9; }
    </style>
</head>
<body>

    <button id="btnV7">TEST CHÂN V7</button>
    <button id="btnV8">TEST CHÂN V8</button>

    <script src="https://www.unpkg.com/@eohjsc/era-widget@1.1.3/src/index.js"></script>
    <script>
        const eraWidget = new EraWidget();
        let actionV7 = null;
        let actionV8 = null;

        eraWidget.init({
            needActions: true,
            onConfiguration: (config) => {
                // Kiểm tra xem đã cấu hình đủ 2 Action trên Web chưa
                if (config.actions && config.actions.length >= 2) {
                    actionV7 = config.actions[0].action; // Action thứ 1
                    actionV8 = config.actions[1].action; // Action thứ 2
                }
            }
        });

        // Xử lý khi nhấn nút V7
        document.getElementById('btnV7').addEventListener('click', () => {
            if (actionV7) {
                // Ghi đè dữ liệu gửi đi thành chuỗi "Hello V7!"
                eraWidget.triggerAction(actionV7, { value: "Xin chao! Toi la nut V7 tu HTML." });
            } else {
                alert("Lỗi: Bạn chưa cấu hình Action thứ 1 (cho V7) trên Web!");
            }
        });

        // Xử lý khi nhấn nút V8
        document.getElementById('btnV8').addEventListener('click', () => {
            if (actionV8) {
                // Ghi đè dữ liệu gửi đi thành chuỗi "Hello V8!"
                eraWidget.triggerAction(actionV8, { value: "Xin chao! Toi la nut V8 tu HTML." });
            } else {
                alert("Lỗi: Bạn chưa cấu hình Action thứ 2 (cho V8) trên Web!");
            }
        });
    </script>
</body>
</html>
