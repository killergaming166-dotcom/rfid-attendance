<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEST BẮN LỆNH XUỐNG ESP32</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.unpkg.com/@eohjsc/era-widget@1.1.3/src/index.js"></script>
</head>
<body class="bg-slate-100 p-8 font-sans">

    <div class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-xl border border-slate-200">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                <i class="fa-solid fa-rocket"></i>
            </div>
            <h2 class="text-2xl font-black text-slate-800">TEST NẠP THẺ</h2>
            <p id="status-text" class="text-xs font-bold text-slate-400 mt-1">Đang chờ kết nối ERa...</p>
        </div>

        <div class="space-y-4">
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Mã thẻ (UID)</label>
                <input type="text" id="uid" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 font-mono text-blue-600 font-bold focus:border-blue-500 outline-none" placeholder="VD: 96576E05">
            </div>
            <div>
                <label class="text-xs font-bold text-slate-500 uppercase">Họ và Tên</label>
                <input type="text" id="name" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-bold focus:border-blue-500 outline-none" placeholder="Nguyễn Văn A">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">MSSV</label>
                    <input type="text" id="mssv" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-bold focus:border-blue-500 outline-none" placeholder="PS12345">
                </div>
                <div>
                    <label class="text-xs font-bold text-slate-500 uppercase">Ca Học</label>
                    <select id="shift" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-700 font-bold focus:border-blue-500 outline-none">
                        <option value="Ca 1">Ca 1</option>
                        <option value="Ca 2" selected>Ca 2</option>
                        <option value="Ca 3">Ca 3</option>
                    </select>
                </div>
            </div>

            <button onclick="sendToESP32()" id="btn-send" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-4 rounded-xl shadow-lg shadow-blue-500/30 transition-all mt-4 opacity-50 cursor-not-allowed" disabled>
                <i class="fa-solid fa-paper-plane mr-2"></i> BẮN LỆNH XUỐNG ESP32
            </button>
        </div>
    </div>

    <script>
        const eraWidget = new EraWidget();
        let actionSendCard = null; // Biến lưu cấu hình Action

        // Khởi tạo ERa Widget
        eraWidget.init({
            needActions: true,
            maxActionsCount: 5,
            onConfiguration: (config) => {
                // Tự động tìm Action đầu tiên Sếp tạo trên Web
                if (config.actions && config.actions.length > 0) {
                    actionSendCard = config.actions[0].action; // Lấy mã Action
                    
                    document.getElementById('status-text').innerText = "ĐÃ KẾT NỐI - SẴN SÀNG BẮN LỆNH!";
                    document.getElementById('status-text').className = "text-xs font-black text-emerald-500 mt-1";
                    
                    const btn = document.getElementById('btn-send');
                    btn.disabled = false;
                    btn.classList.remove('opacity-50', 'cursor-not-allowed');
                } else {
                    document.getElementById('status-text').innerText = "LỖI: Chưa tạo Action trên ERa Dashboard!";
                    document.getElementById('status-text').className = "text-xs font-black text-rose-500 mt-1";
                }
            }
        });

        // Hàm xử lý khi bấm nút
        function sendToESP32() {
            const u = document.getElementById('uid').value.trim();
            const n = document.getElementById('name').value.trim();
            const m = document.getElementById('mssv').value.trim();
            const s = document.getElementById('shift').value;

            if(!u || !n || !m) {
                alert("Vui lòng điền đủ thông tin!");
                return;
            }

            // Gộp thành chuỗi chuẩn
            const payloadString = `${u}|${n}|${m}|${s}`;
            
            // DÙNG LỆNH CỦA SẾP TÌM HIỂU ĐỂ BẮN THẲNG XUỐNG MẠCH
            if (actionSendCard) {
                eraWidget.triggerAction(actionSendCard, null, { value: payloadString });
                
                alert("Đã bắn lệnh xuống ESP32:\n" + payloadString);
            }
        }
    </script>
</body>
</html>
