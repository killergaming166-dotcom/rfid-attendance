<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Điểm Danh RFID</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background: transparent; overflow: hidden; }
        .card { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .pulse-green { animation: pulse-green 2s infinite; }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(34, 197, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div id="app" class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md card border border-gray-100">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-blue-600 tracking-tight">ĐIỂM DANH</h1>
            <div id="connection-status" class="text-[10px] uppercase tracking-widest text-gray-400 mt-1">Đang kết nối Cloud...</div>
        </div>

        <div class="space-y-5">
            <!-- Tên -->
            <div class="bg-slate-50 p-4 rounded-2xl transition-all duration-500" id="box-name">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Họ và Tên</label>
                <div id="display-name" class="text-2xl font-bold text-gray-800">---</div>
            </div>

            <!-- MSSV -->
            <div class="bg-slate-50 p-4 rounded-2xl transition-all duration-500" id="box-mssv">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Mã Số Sinh Viên</label>
                <div id="display-mssv" class="text-xl font-semibold text-gray-700">---</div>
            </div>

            <!-- Mã thẻ -->
            <div class="bg-slate-50 p-4 rounded-2xl transition-all duration-500" id="box-rfid">
                <label class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">Mã Chip RFID</label>
                <div id="display-rfid" class="text-sm font-mono text-gray-500">---</div>
            </div>
        </div>

        <div class="mt-10 flex flex-col items-center">
            <div id="status-icon" class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-3 transition-all duration-500">
                <svg id="icon-svg" class="w-10 h-10 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
            </div>
            <span id="status-text" class="text-sm font-medium text-gray-400 animate-pulse">Vui lòng quẹt thẻ...</span>
        </div>
    </div>

    <script>
        // CẤU HÌNH THÔNG TIN E-RA CỦA BẠN TẠI ĐÂY
        const AUTH_TOKEN = "53f7b5a4-c19e-4760-9940-ff280ac07374";
        const ERA_API_URL = `https://vn.e-ra.io/v1/devices/data?token=${AUTH_TOKEN}`;

        async function fetchData() {
            try {
                const response = await fetch(ERA_API_URL);
                const data = await response.json();
                
                // Giả sử dữ liệu trả về mảng các pin, ta tìm V0, V1, V2
                // Cấu trúc API E-ra thường trả về object có chứa các giá trị Virtual Pin
                const v0 = data.find(p => p.pin === 0)?.value || "---"; // Mã thẻ
                const v1 = data.find(p => p.pin === 1)?.value || "---"; // Tên
                const v2 = data.find(p => p.pin === 2)?.value || "---"; // MSSV

                updateUI(v1, v2, v0);
                document.getElementById('connection-status').innerText = "Cloud Connected";
                document.getElementById('connection-status').classList.replace('text-gray-400', 'text-green-500');
            } catch (error) {
                console.error("Lỗi lấy dữ liệu:", error);
                document.getElementById('connection-status').innerText = "Mất kết nối Cloud";
                document.getElementById('connection-status').classList.replace('text-green-500', 'text-red-500');
            }
        }

        function updateUI(name, mssv, rfid) {
            const nameEl = document.getElementById('display-name');
            const mssvEl = document.getElementById('display-mssv');
            const rfidEl = document.getElementById('display-rfid');
            const icon = document.getElementById('status-icon');
            const iconSvg = document.getElementById('icon-svg');
            const statusText = document.getElementById('status-text');
            const appCard = document.getElementById('app');

            nameEl.innerText = name;
            mssvEl.innerText = mssv;
            rfidEl.innerText = rfid;

            if (name !== "---" && name !== "Sẵn sàng" && name !== "Waiting..." && rfid !== "---") {
                // Trạng thái THÀNH CÔNG
                icon.className = "w-20 h-20 bg-green-500 rounded-full flex items-center justify-center mb-3 shadow-xl pulse-green";
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>';
                iconSvg.classList.replace('text-gray-300', 'text-white');
                statusText.innerText = "XÁC NHẬN THÀNH CÔNG";
                statusText.className = "text-sm font-bold text-green-600";
                appCard.classList.add('border-green-200');
            } else {
                // Trạng thái CHỜ
                icon.className = "w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-3";
                iconSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>';
                iconSvg.classList.add('text-gray-300');
                statusText.innerText = "Vui lòng quẹt thẻ...";
                statusText.className = "text-sm font-medium text-gray-400 animate-pulse";
                appCard.classList.remove('border-green-200');
            }
        }

        // Tự động cập nhật dữ liệu mỗi 2 giây
        setInterval(fetchData, 2000);
        // Chạy lần đầu ngay khi load trang
        fetchData();
    </script>
</body>
</html>
